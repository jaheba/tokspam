[package]
name = "python-spam"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Experimental resource-complexity screening for Python source"
readme = "README.md"
include = ["src/**", "README.md", "SAFETY.md", "LICENSE"]

