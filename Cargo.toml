[package]
name = "tokspam"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Resource-complexity screening for Python source"
readme = "README.md"
repository = "https://github.com/jaheba/tokspam"
include = ["src/**", "README.md", "docs/SAFETY.md", "docs/CONFIGURATION.md", "tests/**", "LICENSE"]

[lib]
name = "tokspam"

[features]
regions = []

[dependencies]
memchr = "2.8"
